<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Event Valley</title>
    <link rel="stylesheet" href="css/landing.css">
</head>
<body>
    <div class="login-container">
        <h2>Login to Event Valley</h2>

        <div class="role-select">
            <button class="role-btn active" data-role="student">Student</button>
            <button class="role-btn" data-role="organizer">Organizer</button>
            <button class="role-btn" data-role="faculty">Faculty</button>
        </div>

        <div id="demoHint" style="font-size:12px;color:#888;margin-bottom:12px;">
            Demo: student@test.com / 123
        </div>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Enter Email" required>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter Password" required autocomplete="new-password">
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>
            <button type="submit" class="btn-primary">Login</button>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
