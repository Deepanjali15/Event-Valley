<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Requests - Event Valley</title>
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="dashboard">

    <aside class="sidebar">
        <h2>Event Valley</h2>
        <ul>
            <li onclick="window.location.href='faculty_dash.html'">Dashboard</li>
            <li class="active">Event Requests</li>
            <li onclick="window.location.href='org_request.html'">Organizer Requests</li>
            <li onclick="window.location.href='notifications.html'">Notifications</li>
        </ul>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </aside>

    <main class="main-content">
        <div class="header">
            <h2>Event Requests</h2>
        </div>

        <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
            <button class="btn-primary" id="btn-all"       onclick="filterEvents('all')">All</button>
            <button class="btn-outline" id="btn-pending"   onclick="filterEvents('pending')">Pending</button>
            <button class="btn-outline" id="btn-approved"  onclick="filterEvents('approved')">Approved</button>
            <button class="btn-outline" id="btn-revision"  onclick="filterEvents('revision')">Needs Revision</button>
            <button class="btn-outline" id="btn-rejected"  onclick="filterEvents('rejected')">Rejected</button>
        </div>

        <!-- Review modal -->
        <div id="reviewModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;">
            <div style="background:white;border-radius:16px;padding:30px;max-width:520px;width:90%;max-height:80vh;overflow-y:auto;">
                <h3 id="modal-title" style="margin-bottom:16px;"></h3>
                <div id="modal-body" style="font-size:14px;color:#444;line-height:1.7;"></div>
                <div id="modal-revision-box" style="display:none;margin-top:16px;">
                    <label style="font-size:13px;color:#666;display:block;margin-bottom:6px;">Revision Note for Organizer:</label>
                    <textarea id="revisionNote" style="width:100%;height:80px;padding:10px;border-radius:8px;border:1px solid #ddd;resize:none;font-size:13px;" placeholder="Explain what needs to be changed..."></textarea>
                </div>
                <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;" id="modal-actions"></div>
            </div>
        </div>

        <div id="eventRequests" class="event-list"></div>
    </main>
</div>
<script src="../../js/notifications_helper.js"></script>
<script src="../../js/faculty/events_req.js"></script>
</body>
</html>
