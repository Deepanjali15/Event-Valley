<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard - Event Valley</title>
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div class="dashboard">

    <aside class="sidebar">
        <h2>Event Valley</h2>
        <ul>
            <li class="active" onclick="window.location.href='student_dash.html'">Dashboard</li>
            <li onclick="window.location.href='my_events.html'">My Events</li>
            <li onclick="window.location.href='events.html'">Explore Events</li>
            <li onclick="window.location.href='notifications.html'">Notifications</li>
            <li onclick="window.location.href='request_org.html'">Request Organizer</li>
        </ul>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </aside>

    <main class="main-content">

        <div class="header">
            <h2 id="welcomeText">Welcome back</h2>
            <span id="userEmail" style="color:#888;font-size:14px;"></span>
        </div>

        <div class="stats">
            <div class="card">
                <h3>Registered</h3>
                <p id="totalEvents">0</p>
            </div>
            <div class="card">
                <h3>Upcoming</h3>
                <p id="upcomingEvents">0</p>
            </div>
            <div class="card">
                <h3>Past Events</h3>
                <p id="pastEvents">0</p>
            </div>
        </div>

        <div class="events-section">
            <h3>My Registered Events</h3>
            <div id="eventList" class="event-list"></div>
        </div>

    </main>
</div>
<script src="../../js/student/dashboard.js"></script>
</body>
</html>
